name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: python -m pytest -v

      - name: Smoke test against the runner's own network
        # Real ping sweep + ARP + port scan of the CI machine's private subnet,
        # limited to a /28 so it takes a few seconds.
        shell: bash
        run: |
          ip=$(python -c "from netscope.network import local_ip; print(local_ip())")
          echo "runner address: $ip"
          case "$ip" in
            10.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*|192.168.*)
              netscope scan --cidr "$ip/28" --ports 22,80,443,3389 --out _smoke --no-resolve
              test -f _smoke/netscope-report.html ;;
            *) echo "runner is not on a private network; skipping" ;;
          esac
